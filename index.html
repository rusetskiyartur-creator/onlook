    <style>
      
        body {
            background-image: url('photo_2026-07-27_12-49-51.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .custom-btn {
            width: 100%;
            height: 44px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
            outline: none;
            border: none;
            margin-top: 1rem;
        }

        .btn-12 {
            border: none;
            box-shadow: 0 0 5px #a78bfa, 0 0 15px #8b5cf6;
            perspective: 2000px;
            transform-style: preserve-3d;
        }

        .btn-12 span {
            background: #41008b;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: 2px solid #a78bfa;
            border-radius: 4px; 
            text-align: center;
            line-height: 40px; 
            box-sizing: border-box;
            transition: transform 0.3s, background 0.3s, border-color 0.3s;
        }

        .btn-12 span:nth-child(1) {
            transform: rotateX(0deg);
            transform-origin: 50% 50% -22px;
        }

        .btn-12 span:nth-child(2) {
            background: #7c3aed;
            border-color: #e879f9;
            transform: rotateX(-90deg);
            transform-origin: 50% 50% -22px;
        }

        .btn-12:hover {
            box-shadow: 0 0 10px #c084fc, 0 0 30px #a855f7, 0 0 50px #e879f9;
        }

        .btn-12:hover span:nth-child(1) {
            transform: rotateX(90deg);
        }

        .btn-12:hover span:nth-child(2) {
            transform: rotateX(0deg);
        }

        /* Стилізація надпису OnLooK у стилі неонового логотипа */
        .logo-text-styled {
            font-family: 'Comfortaa', 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(135deg, #ff2a85 0%, #a855f7 50%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.8)) drop-shadow(0 0 20px rgba(168, 85, 247, 0.6));
        }

        .logo-subtitle {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
